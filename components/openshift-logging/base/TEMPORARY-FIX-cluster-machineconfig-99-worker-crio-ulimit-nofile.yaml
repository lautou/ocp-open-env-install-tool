apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: worker
  name: 99-worker-crio-ulimit-nofile
  # Workaround for OCPBUGS-62095: starting with freshly-installed OCP 4.20+/4.21+
  # clusters, the default container "ulimit -n" (max open files) dropped from
  # 1048576 to 1024. This breaks the OpenShift Logging Vector collector on
  # nodes with high pod density (observed on infra nodes: 73-118 pods each),
  # which needs one open file descriptor per actively-tailed container log
  # file. Tracked upstream: LOG-9336 / LOG-9695 / LOG-9829 (see
  # docs/claude/known-bugs.md). No shipped fix for our version
  # (Logging 6.6.0) as of 2026-08-18 - LOG-9829 targets Logging 6.6.z but is
  # still unreleased.
  #
  # Raises CRI-O's default container nofile soft limit from 1024 to 65536
  # (well under the 524288 hard limit) via a crio.conf.d drop-in, cluster-wide
  # for all worker-role nodes (infra/storage nodes are worker-role too - this
  # cluster has no separate infra MachineConfigPool).
  #
  # Remove once Logging 6.6.z (LOG-9829) or 6.7.0 (LOG-9336) ships with
  # Vector's own self-raise-ulimit fix, or once OCPBUGS-62095's default is
  # revisited upstream.
spec:
  config:
    ignition:
      version: 3.2.0
    storage:
      files:
      - path: /etc/crio/crio.conf.d/99-default-ulimits.conf
        mode: 0644
        overwrite: true
        contents:
          source: data:text/plain;charset=utf-8;base64,W2NyaW8ucnVudGltZV0KZGVmYXVsdF91bGltaXRzID0gWwogICJub2ZpbGU9NjU1MzY6NjU1MzYiLApdCg==
