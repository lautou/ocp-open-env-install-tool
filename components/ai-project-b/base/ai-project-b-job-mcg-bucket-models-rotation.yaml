apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Force=true
  name: mcg-bucket-models-rotation
  namespace: ai-project-b
spec:
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      name: mcg-bucket-models-rotation
    spec:
      serviceAccountName: mcg-bucket-models-rotation
      restartPolicy: Never
      containers:
      - name: create-secret
        image: registry.redhat.io/openshift4/ose-cli:latest
        command:
        - /bin/bash
        - -c
        - |
          set -e

          echo "Waiting for OBC-generated secret models in ai-project-b..."
          while ! oc get secret models -n ai-project-b &>/dev/null; do
            sleep 5
          done
          echo "Secret found"

          ACCESS_KEY=$(oc get secret models -n ai-project-b -o jsonpath='{.data.AWS_ACCESS_KEY_ID}' | base64 -d)
          SECRET_KEY=$(oc get secret models -n ai-project-b -o jsonpath='{.data.AWS_SECRET_ACCESS_KEY}' | base64 -d)
          BUCKET_NAME=$(oc get configmap models -n ai-project-b -o jsonpath='{.data.BUCKET_NAME}')

          echo "Creating Data Connection secret mcg-models in ai-project-b..."
          oc create secret generic mcg-models \
            -n ai-project-b \
            --from-literal=AWS_ACCESS_KEY_ID="${ACCESS_KEY}" \
            --from-literal=AWS_SECRET_ACCESS_KEY="${SECRET_KEY}" \
            --from-literal=AWS_S3_ENDPOINT="http://s3.openshift-storage.svc" \
            --from-literal=AWS_DEFAULT_REGION="us-east-1" \
            --from-literal=AWS_S3_BUCKET="${BUCKET_NAME}" \
            --dry-run=client -o yaml \
            | oc label -f - --local -o yaml opendatahub.io/dashboard=true opendatahub.io/managed=true \
            | oc annotate -f - --local -o yaml opendatahub.io/connection-type=s3 opendatahub.io/connection-type-protocol=s3 \
            | oc apply -f -

          echo "✅ Secret mcg-models ready in ai-project-b"
