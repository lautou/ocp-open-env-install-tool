kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: kueue-workloadpriorityclass-editor-role
rules:
  - apiGroups:
      - kueue.x-k8s.io
    resources:
      - workloadpriorityclasses
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
