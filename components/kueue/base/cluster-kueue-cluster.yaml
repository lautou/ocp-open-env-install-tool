apiVersion: kueue.openshift.io/v1
kind: Kueue
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: cluster
spec:
  config:
    integrations:
      frameworks:
      - BatchJob
      - Deployment
      - Pod
      - PyTorchJob
      - RayCluster
      - RayJob
      - SparkApplication
      - StatefulSet
      - TrainJob
  managementState: Managed
