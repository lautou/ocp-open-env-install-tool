apiVersion: nvidia.com/v1
kind: ClusterPolicy
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: gpu-cluster-policy
spec:
  daemonsets: {}
  dcgm: {}
  dcgmExporter: {}
  devicePlugin:
    config:
      default: high-density-slice
      name: time-slicing-config
  driver:
    enabled: true
  gfd: {}
  nodeStatusExporter:
    enabled: true
  operator: {}
  toolkit: {}
