apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Force=true
  name: create-gpu-l4-machineset
  namespace: openshift-gitops
spec:
  template:
    metadata:
      name: create-gpu-l4-machineset
    spec:
      containers:
        - command:
            - /bin/bash
            - '-c'
            - |
              set -e

              # One GPU L4 MachineSet per AZ, each with MachineAutoscaler min=0/max=1.
              # The cluster autoscaler adds an L4 node in whichever AZ has capacity when a
              # pod requests one; if AWS answers InsufficientInstanceCapacity in an AZ, that
              # node group is backed off and the next AZ is tried. A single AZ-pinned
              # always-on L4 node could not recover from that (observed 2026-11-19: g6.2xlarge
              # capacity exhausted in eu-central-1c after a lab stop/start).

              # 1. Variables and Discovery
              echo "Discovering cluster infrastructure..."

              INFRA_ID=$(oc get infrastructure cluster -o jsonpath='{.status.infrastructureName}')

              # Clone one worker MachineSet per AZ (the installer creates one per AZ)
              BASE_MS_LIST=$(oc get machinesets -n openshift-machine-api -o json | jq -c '.items | map(select(.metadata.name | contains("-worker-"))) | .[]')

              if [[ -z "$BASE_MS_LIST" ]]; then
                echo "ERROR: No worker MachineSet found to clone!"
                exit 1
              fi

              while IFS= read -r BASE_MS; do
                AZ=$(echo "$BASE_MS" | jq -r '.spec.template.spec.providerSpec.value.placement.availabilityZone')
                REGION=$(echo "$BASE_MS" | jq -r '.spec.template.spec.providerSpec.value.placement.region')
                NEW_MS_NAME="${INFRA_ID}-gpu-l4-${AZ}"

                echo "----"
                echo "Target GPU L4 MachineSet Name: $NEW_MS_NAME"
                echo "Target Region: $REGION"
                echo "Target AZ: $AZ"

                # Preserve the live replica count on update - the MachineAutoscaler owns this
                # field after creation. Re-asserting a fixed value here on every run would
                # fight the autoscaler (same class of issue as GitOps/ArgoCD needing
                # ignoreDifferences on /spec/replicas - see KCS 7127428). Only default to 0
                # when the MachineSet doesn't exist yet (first creation).
                CURRENT_REPLICAS=$(oc get machineset "$NEW_MS_NAME" -n openshift-machine-api -o jsonpath='{.spec.replicas}' 2>/dev/null || true)
                echo "Current live replicas: ${CURRENT_REPLICAS:-<none, first creation - defaulting to 0>}"

                echo "Processing GPU L4 MachineSet definition (Create or Update)..."

                # 2. Process the JSON to create/update the MachineSet definition
                # Note: no nvidia.com/device-plugin.config label is set here on purpose -
                # this node inherits the ClusterPolicy cluster-wide default (no time-slicing),
                # unlike the T4 MachineSet which explicitly opts in to time-slicing.
                # The subnet comes from the cloned worker MachineSet, so it already matches $AZ.

                echo "$BASE_MS" | jq \
                  --arg name "$NEW_MS_NAME" \
                  --arg instanceType "g6.2xlarge" \
                  --arg az "$AZ" \
                  --argjson replicas "${CURRENT_REPLICAS:-0}" \
                  '
                  .metadata = {
                    "name": $name,
                    "namespace": "openshift-machine-api",
                    "labels": .metadata.labels
                  } |
                  .spec.replicas = $replicas |
                  .spec.selector.matchLabels["machine.openshift.io/cluster-api-machineset"] = $name |
                  .spec.template.metadata.labels["machine.openshift.io/cluster-api-machineset"] = $name |
                  .spec.template.spec.providerSpec.value.instanceType = $instanceType |
                  .spec.template.spec.providerSpec.value.placement.availabilityZone = $az |
                  .spec.template.spec.metadata.labels["cluster-api/accelerator"] = "nvidia" |
                  .spec.template.spec.metadata.labels["nvidia.com/gpu.product"] = "NVIDIA-L4" |
                  .metadata.annotations["capacity.cluster-autoscaler.kubernetes.io/labels"] = "kubernetes.io/arch=amd64,nvidia.com/gpu.product=NVIDIA-L4" |
                  .spec.template.spec.taints = [
                    {
                      "key": "nvidia.com/gpu",
                      "value": "present",
                      "effect": "NoSchedule"
                    }
                  ] |
                  del(.status) |
                  del(.metadata.creationTimestamp) |
                  del(.metadata.uid) |
                  del(.metadata.resourceVersion) |
                  del(.metadata.generation)
                  ' > /tmp/gpu-l4-machineset.json

                # Apply the MachineSet (Create or Patch)
                oc apply -f /tmp/gpu-l4-machineset.json
                echo "✅ GPU L4 MachineSet $NEW_MS_NAME applied successfully."

                # 3. Create the scale-from-zero MachineAutoscaler (min=0/max=1 per AZ)
                echo "Creating/Updating MachineAutoscaler for $NEW_MS_NAME..."

                cat <<EOF | oc apply -n openshift-machine-api -f -
              apiVersion: autoscaling.openshift.io/v1beta1
              kind: MachineAutoscaler
              metadata:
                name: $NEW_MS_NAME
                namespace: openshift-machine-api
              spec:
                maxReplicas: 1
                minReplicas: 0
                scaleTargetRef:
                  apiVersion: machine.openshift.io/v1beta1
                  kind: MachineSet
                  name: $NEW_MS_NAME
              EOF

                echo "✅ MachineAutoscaler for $NEW_MS_NAME applied successfully (min=0/max=1)."
              done <<< "$BASE_MS_LIST"
          image: quay.io/devfile/universal-developer-image:ubi9-latest
          name: create-gpu-l4-machineset
      restartPolicy: Never
      serviceAccountName: gpu-machineset-operator
