apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  name: cluster-versions
  namespace: openshift-gitops
data:
  # Observability
  cluster-logging: "stable-6.6"
  cluster-observability: "stable"
  grafana: "v5"
  loki: "stable-6.6"
  network-observability: "stable"
  opentelemetry: "stable"
  tempo: "stable"

  # Integration
  openshift-service-mesh: "stable"
  rhbar: "3.x"  # Red Hat build of Apicurio Registry

  # API Gateway (Red Hat Connectivity Link - Kuadrant)
  authorino-operator: "stable"
  dns-operator: "stable"
  limitador-operator: "stable"
  rhcl-operator: "stable"

  # CI/CD & Dev Tools
  cert-manager: "stable-v1.20"
  devworkspace: "fast"  # Usually coupled with Web Terminal
  openshift-builds: "builds-1.8"
  openshift-gitops: "gitops-1.21"
  openshift-pipelines: "pipelines-1.23"
  web-terminal: "fast"

  # Infrastructure & Storage
  ack-route53: "alpha"
  nfd: "stable"  # Node Feature Discovery
  nfs-provisioner: "alpha"
  
  # OpenShift Data Foundation (ODF)
  # All ODF components typically share the same version lifecycle
  odf: "stable-4.22"

  vertical-pod-autoscaler: "stable"

  # AI
  jobset: "stable-v1.0"
  kueue: "stable-v1.4"
  lws: "stable-v1.0"
  nvidia-gpu-operator: "v26.3"
  rhoai: "stable-3.5"

  # Cluster management
  rhacm: "release-2.17"
  rhacs: "rhacs-4.11"
