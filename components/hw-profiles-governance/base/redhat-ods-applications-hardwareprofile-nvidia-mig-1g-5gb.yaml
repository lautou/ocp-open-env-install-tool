apiVersion: infrastructure.opendatahub.io/v1
kind: HardwareProfile
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    opendatahub.io/dashboard-feature-visibility: '["workbench","model-serving"]'
    opendatahub.io/description: "Hardware-isolated 5GB GPU slice."
    opendatahub.io/display-name: "GPU: MIG 1g.5gb"
  name: nvidia-mig-1g-5gb
  namespace: redhat-ods-applications
spec:
  identifiers:
  - defaultCount: 8
    displayName: CPU
    identifier: cpu
    maxCount: 16
    minCount: 4
    resourceType: CPU
  - defaultCount: 32Gi
    displayName: Memory
    identifier: memory
    maxCount: 64Gi
    minCount: 16Gi
    resourceType: Memory
  - defaultCount: 1
    displayName: "MIG Slice"
    identifier: "nvidia.com/mig-1g.5gb"
    maxCount: 1
    minCount: 1
    resourceType: Accelerator
  scheduling:
    node:
      nodeSelector:
        nvidia.com/gpu.product: nvidia-mig-sliced
      tolerations:
      - effect: NoSchedule
        key: workload
        operator: Equal
        value: training
    type: Node
