apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Force=true
  name: patch-golden-dataset-pv-retain
  namespace: ai-supply-chain
spec:
  template:
    metadata:
      name: patch-golden-dataset-pv-retain
    spec:
      containers:
      - command:
        - /bin/bash
        - -c
        - |
          set -e

          echo "Waiting for PVC golden-dataset in ai-supply-chain to bind to a PersistentVolume..."
          VOLUME_NAME=""
          while [ -z "${VOLUME_NAME}" ]; do
            VOLUME_NAME=$(oc get pvc golden-dataset -n ai-supply-chain -o jsonpath='{.spec.volumeName}' 2>/dev/null)
            [ -z "${VOLUME_NAME}" ] && sleep 5
          done
          echo "PVC golden-dataset bound to PersistentVolume ${VOLUME_NAME}"

          echo "Setting persistentVolumeReclaimPolicy=Retain on ${VOLUME_NAME}..."
          oc patch pv "${VOLUME_NAME}" -p '{"spec":{"persistentVolumeReclaimPolicy":"Retain"}}'
          echo "Done: PersistentVolume ${VOLUME_NAME} will survive PVC/namespace deletion"
        image: registry.redhat.io/openshift4/ose-cli-rhel9:v4.22
        name: patch-pv-reclaim-policy
      restartPolicy: Never
      serviceAccountName: patch-golden-dataset-pv-retain
  ttlSecondsAfterFinished: 600
