apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Force=true
  name: create-secret-corporate-data-lake
  namespace: ai-supply-chain
spec:
  template:
    metadata:
      name: create-secret-corporate-data-lake
    spec:
      containers:
      - command:
        - /bin/bash
        - -c
        - |
          set -e

          echo "Waiting for OBC-generated secret private-models in ai-supply-chain..."
          while ! oc get secret private-models -n ai-supply-chain &>/dev/null; do
            sleep 5
          done
          echo "Secret found"

          ACCESS_KEY=$(oc get secret private-models -n ai-supply-chain -o jsonpath='{.data.AWS_ACCESS_KEY_ID}' | base64 -d)
          SECRET_KEY=$(oc get secret private-models -n ai-supply-chain -o jsonpath='{.data.AWS_SECRET_ACCESS_KEY}' | base64 -d)
          BUCKET_NAME=$(oc get configmap private-models -n ai-supply-chain -o jsonpath='{.data.BUCKET_NAME}')

          echo "Creating Data Connection secret corporate-data-lake in ai-supply-chain..."
          oc create secret generic corporate-data-lake \
            -n ai-supply-chain \
            --from-literal=AWS_ACCESS_KEY_ID="${ACCESS_KEY}" \
            --from-literal=AWS_SECRET_ACCESS_KEY="${SECRET_KEY}" \
            --from-literal=AWS_S3_ENDPOINT="http://s3.openshift-storage.svc" \
            --from-literal=AWS_DEFAULT_REGION="us-east-1" \
            --from-literal=AWS_S3_BUCKET="${BUCKET_NAME}" \
            --dry-run=client -o yaml \
            | oc label -f - --local -o yaml opendatahub.io/dashboard=true opendatahub.io/managed=true \
            | oc annotate -f - --local -o yaml \
                opendatahub.io/connection-type=s3 \
                opendatahub.io/connection-type-protocol=s3 \
                openshift.io/display-name="Corporate S3 Data" \
                openshift.io/description="Read-only access to the corporate data lake." \
            | oc apply -f -

          echo "Secret corporate-data-lake ready in ai-supply-chain"
        image: registry.redhat.io/openshift4/ose-cli-rhel9:v4.22
        name: create-secret-corporate-data-lake
      restartPolicy: Never
      serviceAccountName: create-secret-corporate-data-lake
