apiVersion: infrastructure.opendatahub.io/v1
kind: HardwareProfile
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    opendatahub.io/dashboard-feature-visibility: '["workbench"]'
    opendatahub.io/description: "Shared GPU access via time-slicing."
    opendatahub.io/display-name: "GPU: Shared (V100)"
  name: nvidia-shared-v100
  namespace: redhat-ods-applications
spec:
  identifiers:
  - defaultCount: 8
    displayName: CPU
    identifier: cpu
    maxCount: 16
    minCount: 4
    resourceType: CPU
  - defaultCount: 32Gi
    displayName: Memory
    identifier: memory
    maxCount: 64Gi
    minCount: 16Gi
    resourceType: Memory
  - defaultCount: 1
    displayName: "Shared GPU"
    identifier: nvidia.com/gpu
    maxCount: 1
    minCount: 1
    resourceType: Accelerator
  scheduling:
    node:
      nodeSelector:
        nvidia.com/gpu.product: nvidia-shared-v100
      tolerations:
      - effect: NoSchedule
        key: workload
        operator: Equal
        value: training
    type: Node
