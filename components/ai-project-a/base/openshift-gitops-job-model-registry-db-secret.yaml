apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Force=true
  name: model-registry-db-secret
  namespace: openshift-gitops
spec:
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      name: model-registry-db-secret
    spec:
      serviceAccountName: model-registry-db-secret
      restartPolicy: Never
      containers:
      - name: create-secret
        image: registry.redhat.io/openshift4/ose-cli:latest
        command:
        - /bin/bash
        - -c
        - |
          set -e

          echo "Waiting for mysql-credentials secret in external-db-model-registry..."
          while ! oc get secret mysql-credentials -n external-db-model-registry &>/dev/null; do
            sleep 5
          done
          echo "Secret found"

          MYSQL_PASSWORD=$(oc get secret mysql-credentials -n external-db-model-registry -o jsonpath='{.data.MYSQL_PASSWORD}' | base64 -d)

          echo "Creating registry-db-secret secret in rhoai-model-registries..."
          oc create secret generic registry-db-secret \
            -n rhoai-model-registries \
            --from-literal=database-password="${MYSQL_PASSWORD}" \
            --dry-run=client -o yaml | oc apply -f -

          echo "✅ Secret registry-db-secret ready in rhoai-model-registries"
