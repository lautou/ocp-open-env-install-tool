# Works around RHOAIENG-100710: the TrustyAI operator only binds the
# trustyai-service-operator-evalhub-providers-access ClusterRole to evalhub-service and its own
# controller-manager SA, so no identity in this tenant namespace can call EvalHub's providers API
# (e.g. `evalhub providers describe` from a workbench) without this grant.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: evalhub-providers-access
  namespace: ai-agent-tracing
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: trustyai-service-operator-evalhub-providers-access
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: system:serviceaccounts:ai-agent-tracing
