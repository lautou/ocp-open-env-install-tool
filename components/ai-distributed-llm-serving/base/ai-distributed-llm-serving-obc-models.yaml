apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: models
  namespace: ai-distributed-llm-serving
spec:
  additionalConfig:
    bucketclass: noobaa-default-bucket-class
  # Fixed (not generateBucketName) so the LLMInferenceService model.uri can be
  # declared statically in Git — a generated name changes on every cluster rebuild.
  bucketName: models-ai-distributed-llm-serving
  storageClassName: openshift-storage.noobaa.io
