apiVersion: infrastructure.opendatahub.io/v1
kind: HardwareProfile
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    opendatahub.io/dashboard-feature-visibility: '["workbench"]'
    opendatahub.io/description: "Shared GPU segment. Good for inference and light training."
    opendatahub.io/display-name: "NVIDIA L40S (Time-Sliced)"
  name: profile-l40s-slice
  namespace: redhat-ods-applications
spec:
  identifiers:
  - defaultCount: 1
    displayName: "Shared GPU"
    identifier: nvidia.com/gpu
    minCount: 1
    resourceType: Accelerator
  scheduling:
    kueue:
      localQueueName: local-queue-gpu
    type: Queue
