apiVersion: ogx.io/v1beta1
kind: OGXServer
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    openshift.io/display-name: lsd-genai-playground
  labels:
    opendatahub.io/dashboard: "true"
  name: lsd-genai-playground
  namespace: my-first-model
spec:
  distribution:
    name: rh
  network: {}
  providers:
    inference:
      remote:
        vllm:
        - id: llama-32-3b-instruct
          endpoint: http://llama-32-3b-instruct-predictor.my-first-model.svc.cluster.local:8080/v1
  resources:
    models:
    - name: llama-32-3b-instruct
      modelType: llm
      provider: llama-32-3b-instruct
