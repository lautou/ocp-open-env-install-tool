apiVersion: v1
kind: ConfigMap
metadata:
  name: ogx-base-config
  namespace: my-first-model
  labels:
    ogx.io/watch: "true"
data:
  config.yaml: |
    version: "2"
    distro_name: rh
    apis:
    - inference
    - vector_io
    - responses
    providers:
      inference:
      - provider_id: vllm-inference-1
        provider_type: remote::vllm
        config:
          base_url: http://llama-32-3b-instruct-predictor.my-first-model.svc.cluster.local:8080/v1
          tls_verify: false
      vector_io:
      - provider_id: faiss
        provider_type: inline::faiss
        config:
          persistence:
            backend: kv_default
            namespace: vector_io::faiss
      responses:
      - provider_id: builtin
        provider_type: inline::builtin
        config:
          persistence:
            responses:
              backend: sql_default
              table_name: responses
    registered_resources:
      models:
      - provider_id: vllm-inference-1
        model_id: llama-32-3b-instruct
        model_type: llm
        metadata:
          display_name: llama-32-3b-instruct
    server:
      port: 8321
