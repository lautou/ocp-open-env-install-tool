apiVersion: infrastructure.opendatahub.io/v1
kind: HardwareProfile
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    opendatahub.io/display-name: GPU Profile - L4
  name: gpu-l4-profile
  namespace: redhat-ods-applications
spec:
  identifiers:
  - defaultCount: 4
    displayName: CPU
    identifier: cpu
    maxCount: 8
    minCount: 1
    resourceType: CPU
  - defaultCount: 16Gi
    displayName: Memory
    identifier: memory
    maxCount: 24Gi
    minCount: 8Gi
    resourceType: Memory
  - defaultCount: 1
    displayName: GPU
    identifier: nvidia.com/gpu
    maxCount: 1
    minCount: 1
    resourceType: Accelerator
  scheduling:
    node:
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-L4
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
    type: Node
