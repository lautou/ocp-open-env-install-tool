apiVersion: v1
kind: ConfigMap
metadata:
  name: model-catalog-sources
  namespace: rhoai-model-registries
data:
  sources.yaml: |
    catalogs:
      - name: "Model-Registry-Lab"
        id: "registry-custom-models"
        enabled: true
        type: "yaml"
        properties:
          yamlCatalogPath: "/data/user-model-sources/registry-models.yaml"
  registry-models.yaml: |
    source: Model-Registry-Lab
    models:
      # --- MODEL 1: Qwen/Qwen3-0.6B ---
      - name: "Qwen3-0.6B"
        provider: XYZ Company
        description: "Qwen Small Language Model"
        customProperties:
          model_type:
            metadataType: MetadataStringValue
            string_value: "generative"
          author:
            metadataType: MetadataStringValue
            string_value: "Qwen"
          version:
            metadataType: MetadataStringValue
            string_value: "1.0"
        artifacts:
          - uri: "s3://models/Qwen3-0.6B/1.0.0/"
