apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Force=true
  name: patch-mlflow-artifacts-destination
  namespace: openshift-gitops
spec:
  template:
    metadata:
      name: patch-mlflow-artifacts-destination
    spec:
      containers:
      - name: patch-mlflow
        image: registry.redhat.io/openshift4/ose-cli-rhel9:v4.22
        command:
        - /bin/bash
        - -c
        - |
          set -e

          echo "Waiting for OBC-generated secret/configmap mlflow in external-db-s3-mlflow..."
          while ! oc get secret mlflow -n external-db-s3-mlflow &>/dev/null; do
            sleep 5
          done
          while ! oc get configmap mlflow -n external-db-s3-mlflow &>/dev/null; do
            sleep 5
          done
          echo "OBC bucket ready"

          ACCESS_KEY=$(oc get secret mlflow -n external-db-s3-mlflow -o jsonpath='{.data.AWS_ACCESS_KEY_ID}' | base64 -d)
          SECRET_KEY=$(oc get secret mlflow -n external-db-s3-mlflow -o jsonpath='{.data.AWS_SECRET_ACCESS_KEY}' | base64 -d)
          BUCKET_NAME=$(oc get configmap mlflow -n external-db-s3-mlflow -o jsonpath='{.data.BUCKET_NAME}')

          echo "Creating mlflow-s3-credentials secret in redhat-ods-applications..."
          oc create secret generic mlflow-s3-credentials \
            -n redhat-ods-applications \
            --from-literal=AWS_ACCESS_KEY_ID="${ACCESS_KEY}" \
            --from-literal=AWS_SECRET_ACCESS_KEY="${SECRET_KEY}" \
            --dry-run=client -o yaml \
            | oc apply -f -

          echo "Waiting for MLflow CR mlflow (cluster-scoped)..."
          while ! oc get mlflow mlflow &>/dev/null; do
            sleep 5
          done

          echo "Patching artifactsDestination to s3://${BUCKET_NAME}..."
          oc patch mlflow mlflow --type merge -p "{\"spec\":{\"artifactsDestination\":\"s3://${BUCKET_NAME}\"}}"

          echo "✅ MLflow S3 artifacts configured"
      restartPolicy: Never
      serviceAccountName: mlflow-artifacts-patcher
  ttlSecondsAfterFinished: 600
