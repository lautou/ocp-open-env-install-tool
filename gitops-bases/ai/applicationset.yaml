apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-ai
  namespace: openshift-gitops
spec:
  generators:
  - list:
      elements:
      - branch: master
        item: agent-traces-mlflow
      - branch: master
        item: ai-gpuaas
      - branch: master
        item: ai-supply-chain
      - branch: master
        item: hw-profiles-governance
      - branch: master
        item: jobset
      - branch: master
        item: kueue
      - branch: master
        item: leader-work-set
      - branch: master
        item: llmd-deploy-lab
      - branch: master
        item: mcp
      - branch: master
        item: model-deploy-lab
      - branch: master
        item: model-registry-lab
      - branch: master
        item: nvidia-gpu-operator
      - branch: master
        item: observing-ai-apps
      - branch: master
        item: rh-connectivity-link
      - branch: master
        item: rhoai
  template:
    metadata:
      finalizers:
      - resources-finalizer.argocd.argoproj.io/background
      name: '{{item}}'
    spec:
      project: default
      source:
        path: components/{{item}}/overlays/default
        repoURL: https://github.com/lautou/ocp-open-env-install-tool.git
        targetRevision: '{{branch}}'
      destination:
        server: https://kubernetes.default.svc
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 10
      ignoreDifferences:
      - group: ''
        jsonPointers:
        - /metadata/annotations
        kind: ConfigMap
        name: cluster-versions
      - group: ''
        jsonPointers:
        - /metadata/annotations
        kind: ConfigMap
        name: model-catalog-sources
      - group: serving.kserve.io
        jsonPointers:
        - /spec/predictor/nodeSelector
        - /spec/predictor/tolerations
        kind: InferenceService
      - group: kubeflow.org
        jsonPointers:
        - /metadata/annotations/notebooks.opendatahub.io~1last-image-selection
        - /metadata/annotations/notebooks.opendatahub.io~1last-image-version-git-commit-selection
        - /metadata/annotations/opendatahub.io~1connections
        - /metadata/annotations/opendatahub.io~1hardware-profile-resource-version
        - /metadata/annotations/opendatahub.io~1image-display-name
        - /metadata/annotations/opendatahub.io~1workbench-image-namespace
        - /metadata/annotations/openshift.io~1description
        jqPathExpressions:
        - .spec.template.spec.containers[] | select(.name == "kube-rbac-proxy")
        - .spec.template.spec.volumes[] | select(.name == "kube-rbac-proxy-config")
        - .spec.template.spec.volumes[] | select(.name == "kube-rbac-proxy-tls-certificates")
        kind: Notebook
