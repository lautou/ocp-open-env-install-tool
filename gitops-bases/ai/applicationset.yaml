apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-ai
  namespace: openshift-gitops
spec:
  generators:
  - list:
      elements:
      - branch: master
        item: ai-agent-tracing
        project: ai-usecases
      - branch: master
        item: ai-distributed-llm-serving
        project: ai-usecases
      - branch: master
        item: ai-gpu-quota-infrastructure
        project: ai-usecases
      - branch: master
        item: ai-gpu-quota-management
        project: ai-usecases
      - branch: master
        item: ai-llm-observability
        project: ai-usecases
      - branch: master
        item: ai-model-data-sourcing
        project: ai-usecases
      - branch: master
        item: ai-model-registry-governance
        project: ai-usecases
      - branch: master
        item: ai-multi-tenant-gpu-fairness
        project: ai-usecases
      - branch: master
        item: ai-single-pod-llm-serving
        project: ai-usecases
      - branch: master
        item: jobset
        project: rhoai
      - branch: master
        item: leader-work-set
        project: rhoai
      - branch: master
        item: mcp
        project: rhoai
      - branch: master
        item: nvidia-gpu-operator
        project: rhoai
      - branch: master
        item: rh-connectivity-link
        project: rhoai
      - branch: master
        item: rhoai
        project: rhoai
  template:
    metadata:
      finalizers:
      - resources-finalizer.argocd.argoproj.io/background
      name: '{{item}}'
    spec:
      destination:
        server: https://kubernetes.default.svc
      ignoreDifferences:
      - group: ''
        jsonPointers:
        - /metadata/annotations
        kind: ConfigMap
        name: cluster-versions
      - group: ''
        jsonPointers:
        - /metadata/annotations
        kind: ConfigMap
        name: model-catalog-sources
      - group: serving.kserve.io
        jsonPointers:
        - /spec/predictor/nodeSelector
        - /spec/predictor/tolerations
        kind: InferenceService
      - group: serving.kserve.io
        jsonPointers:
        - /spec/model/uri
        kind: LLMInferenceService
      - group: kubeflow.org
        jsonPointers:
        - /metadata/annotations/notebooks.opendatahub.io~1last-image-selection
        - /metadata/annotations/notebooks.opendatahub.io~1last-image-version-git-commit-selection
        - /metadata/annotations/opendatahub.io~1connections
        - /metadata/annotations/opendatahub.io~1hardware-profile-resource-version
        - /metadata/annotations/opendatahub.io~1image-display-name
        - /metadata/annotations/opendatahub.io~1workbench-image-namespace
        - /metadata/annotations/openshift.io~1description
        jqPathExpressions:
        - .spec.template.spec.containers[] | select(.name == "kube-rbac-proxy")
        - .spec.template.spec.volumes[] | select(.name == "kube-rbac-proxy-config")
        - .spec.template.spec.volumes[] | select(.name == "kube-rbac-proxy-tls-certificates")
        - .spec.template.spec.containers[].env[]? | select(.name == "MLFLOW_TRACKING_URI")
        kind: Notebook
      project: '{{project}}'
      source:
        path: components/{{item}}/overlays/default
        repoURL: https://github.com/lautou/ocp-open-env-install-tool.git
        targetRevision: '{{branch}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 10
