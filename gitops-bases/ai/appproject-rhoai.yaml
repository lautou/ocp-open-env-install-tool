apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: rhoai
  namespace: openshift-gitops
spec:
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
  description: RHOAI platform + its infra operators
  destinations:
  - server: https://kubernetes.default.svc
    namespace: '*'
  sourceRepos:
  - https://github.com/lautou/ocp-open-env-install-tool.git
  - https://charts.openshift.io/
